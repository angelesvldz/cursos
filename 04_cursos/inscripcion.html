<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechAcademy - Inscripción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cssMentoria.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 
</head>
<body>
    <header>
        <div id="logo">
            <h1>TechAcademy</h1>
        </div>
        <nav class="navPrincipal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="mentoria.html">Mentoría</a></li>
                <li><a href="inscripcion.html" id="btn_destacado">Inscribirse</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor_principal">
        <section class="seccion_formulario">
            <h2>Formulario de Inscripción</h2>
            <p class="subtitulo_seccion">Completa tus datos para reservar tu lugar en nuestros cursos.</p>

            <form action="inscripcion.html" method="GET" class="caja_formulario">
                
                <div class="mb-3">
                    <label for="nombreCompleto" class="form-label">Nombre Completo:</label>
                    <input type="text" id="nombreCompleto" name="nombreCompleto" class="form-control" placeholder="Ej. Ana López" required>
                </div>

                <div class="mb-3">
                    <label for="correoElectronico" class="form-label">Correo Electrónico:</label>
                    <input type="email" id="correoElectronico" name="correoElectronico" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="telefonoContacto" class="form-label">Teléfono de Contacto:</label>
                    <input type="tel" id="telefonoContacto" name="telefonoContacto" class="form-control" placeholder="10 dígitos" required>
                </div>

                <div class="mb-3">
                    <label for="cursoSeleccionado" class="form-label">Selecciona tu Curso:</label>
                    <select id="cursoSeleccionado" name="cursoSeleccionado" class="form-select" required>
                        <option value="" selected disabled>Elige una opción...</option>
                        <option value="frontend">Desarrollo Web FrontEnd</option>
                        <option value="python">Python para Ciencia de Datos</option>
                        <option value="bd">Base de Datos Robustas</option>
                        <option value="backend">Programación Backend con APIs</option>
                        <option value="ciberseguridad">Fundamentos de la Ciberseguridad</option>
                        <option value="ia">Introducción a la IA Generativa</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="modalidadEstudio" class="form-label">Modalidad Preferida:</label>
                    <select id="modalidadEstudio" name="modalidadEstudio" class="form-select" required>
                        <option value="en_linea">100% En Línea</option>
                        <option value="hibrida">Híbrida (Clases en vivo + grabaciones)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="comentariosAdicionales" class="form-label">Comentarios o dudas (Opcional):</label>
                    <textarea id="comentariosAdicionales" name="comentariosAdicionales" class="form-control" rows="3" placeholder="Cuéntanos sobre tu experiencia previa..."></textarea>
                </div>


                <div class="contenedor_botones_form">
                    <button type="submit" id="btn_accion" class="btn">Enviar Inscripción</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TechAcademy</p>
    </footer>
</body>
</html>
